name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      NEXTEST_PROFILE: ci
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v5
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.146,cargo-deny@0.20.2,cargo-machete@0.9.2
      - name: Install the ALSA headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Run all checks
        run: cargo xtask check
