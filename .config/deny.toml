[graph]
all-features = true

[advisories]
version = 2

[licenses]
version = 2
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unicode-3.0",
  "MPL-2.0",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "LGPL-2.1-or-later",
  "LGPL-3.0",
  "GPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
