[package]
name = "antenna-library"
version = "0.1.0"
description = "Documents, segment store and search of Antenna"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
antenna-core.workspace = true
directories.workspace = true
hound.workspace = true
jiff = { workspace = true, features = ["serde", "std"] }
serde = { workspace = true, features = ["derive", "std"] }
sha2.workspace = true
thiserror = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["display", "parse", "serde", "std"] }
unicode-normalization = { workspace = true, features = ["std"] }
uuid = { workspace = true, features = ["serde", "std", "v7"] }

[dev-dependencies]
proptest = { workspace = true, features = ["std"] }
tempfile.workspace = true

[lints]
workspace = true
