[package]
name = "antenna-text"
version = "0.1.0"

[features]
whatlang = ["dep:whatlang"]

[dependencies]
antenna-core.workspace = true
whatlang = { version = "0.16", optional = true }
srx = { version = "0.1", features = ["from_xml"] }
pulldown-cmark = { workspace = true, features = ["simd"] }

[dev-dependencies]
insta.workspace = true
antenna-engine-fake = { path = "../engines/fake" }

[dev-dependencies.proptest]
version = "1"

[target.'cfg(windows)'.dependencies]
srx = { workspace = true, version = "1" }

[lints]
workspace = true
