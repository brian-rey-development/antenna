[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/engines/fake",
  "crates/engines/registry",
  "crates/engines/testkit",
  "tools/xtask",
]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/brian-rey-development/antenna"
rust-version = "1.98"

[workspace.dependencies]
antenna-core = { path = "crates/core" }
antenna-engine-fake = { path = "crates/engines/fake" }
antenna-engine-registry = { path = "crates/engines/registry", default-features = false }
antenna-engine-testkit = { path = "crates/engines/testkit" }

cargo_metadata = { version = "0.23.1", default-features = false }
flume = { version = "0.12.0", default-features = false }
strum = { version = "0.28.0", default-features = false }
thiserror = { version = "2.0.21", default-features = false }
toml = { version = "1.1.6", default-features = false }

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
let_underscore_drop = "warn"
non_ascii_idents = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
absolute_paths = "warn"
clone_on_ref_ptr = "warn"
cognitive_complexity = "warn"
dbg_macro = "warn"
derive_partial_eq_without_eq = "warn"
expect_used = "warn"
float_cmp_const = "warn"
get_unwrap = "warn"
if_then_some_else_none = "warn"
indexing_slicing = "warn"
iter_over_hash_type = "warn"
large_include_file = "warn"
let_underscore_must_use = "warn"
let_underscore_untyped = "warn"
lossy_float_literal = "warn"
map_err_ignore = "warn"
mem_forget = "warn"
missing_asserts_for_indexing = "warn"
panic = "warn"
partial_pub_fields = "warn"
print_stderr = "warn"
print_stdout = "warn"
redundant_clone = "warn"
redundant_type_annotations = "warn"
self_named_module_files = "warn"
shadow_unrelated = "warn"
str_to_string = "warn"
string_slice = "warn"
tests_outside_test_module = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
unused_result_ok = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
use_self = "warn"
wildcard_enum_match_arm = "warn"

[profile.release]
lto = "fat"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 3
